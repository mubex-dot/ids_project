<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IDS Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f4f9;
      }
      header {
        background: #222;
        color: #fff;
        padding: 14px;
        text-align: center;
      }
      .container {
        padding: 12px;
        max-width: 1200px;
        margin: auto;
      }
      #filter {
        padding: 6px;
        width: 320px;
        margin-bottom: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px;
        border: 1px solid #ddd;
        text-align: left;
        font-size: 13px;
      }
      th {
        background: #333;
        color: #fff;
      }
      tr.attack {
        background: #ffd6d6;
      }
      tr.normal {
        background: #e9ffe9;
      }
      tr.highlight {
        animation: flash 1s ease;
      }
      @keyframes flash {
        0% {
          background: yellow;
        }
        100% {
          background: inherit;
        }
      }
    </style>
  </head>
  <body>
    <header><h2 style="margin: 0">Live IDS Dashboard</h2></header>
    <div class="container">
      <input id="filter" placeholder="Filter by IP, service, flag..." />
      <table id="tbl">
        <thead>
          <tr>
            <th>Time</th>
            <th>Src</th>
            <th>Dst</th>
            <th>Svc</th>
            <th>Flag</th>
            <th>Proto</th>
            <th>Bytes (s/d)</th>
            <th>Cnt</th>
            <th>SrvCnt</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <audio id="alertSound" src="alert.wav" preload="auto"></audio>
    <script>
      const socket = io();
      const tbody = document.querySelector("#tbl tbody");
      const filter = document.getElementById("filter");
      const alertSound = document.getElementById("alertSound");
      const MAX = 100;
      let alerts = [];

      function render() {
        const f = filter.value.toLowerCase();
        tbody.innerHTML = "";
        let shown = 0;
        for (let a of alerts) {
          if (shown >= MAX) break;
          const text = `${a.src || ""} ${a.dst || ""} ${a.service || ""} ${
            a.flag || ""
          }`.toLowerCase();
          if (f && !text.includes(f)) continue;
          const tr = document.createElement("tr");
          tr.className = a.pred === "ATTACK" ? "attack highlight" : "normal";
          tr.innerHTML = `<td>${a.ts || ""}</td>
      <td>${a.src || ""}</td>
      <td>${a.dst || ""}</td>
      <td>${a.service || ""}</td>
      <td>${a.flag || ""}</td>
      <td>${a.protocol_type || ""}</td>
      <td>${a.src_bytes || 0}/${a.dst_bytes || 0}</td>
      <td>${a.count || 0}</td>
      <td>${a.srv_count || 0}</td>
      <td>${a.pred || ""}</td>`;
          tbody.prepend(tr);
          shown++;
        }
      }

      socket.on("connect", () => console.log("connected to server"));
      socket.on("alert", (a) => {
        alerts.unshift(a);
        if (alerts.length > 1000) alerts.pop();
        if (a.pred === "ATTACK") {
          try {
            alertSound.play();
          } catch (e) {
            /* autoplay may be blocked */
          }
        }
        render();
      });

      filter.addEventListener("input", render);

      // initial load of recent alerts (optional)
      fetch("/alerts/download")
        .then((r) => r.json())
        .then((data) => {
          if (Array.isArray(data))
            data.reverse().forEach((d) => alerts.unshift(d));
          render();
        });
    </script>
  </body>
</html>
