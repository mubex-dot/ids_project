<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IDS Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f9;
        margin: 0;
        padding: 0;
      }
      header {
        background: #222;
        color: #fff;
        padding: 10px 20px;
        text-align: center;
        font-size: 1.5em;
      }
      .container {
        padding: 10px 20px;
        max-width: 1200px;
        margin: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      th,
      td {
        padding: 8px 12px;
        border: 1px solid #ccc;
        text-align: left;
      }
      th {
        background: #333;
        color: #fff;
      }
      tr.attack {
        background: #ffcccc;
      }
      tr.normal {
        background: #ccffcc;
      }
      tr.highlight {
        animation: flash 1s ease;
      }
      @keyframes flash {
        0% {
          background-color: yellow;
        }
        100% {
          background-color: inherit;
        }
      }
      #filterBox {
        margin: 10px 0;
        padding: 6px;
        width: 100%;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <header>IDS Real-Time Dashboard</header>
    <div class="container">
      <input
        type="text"
        id="filterBox"
        placeholder="Filter by IP, Service, or Flag..."
      />
      <table id="alertsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Service</th>
            <th>Flag</th>
            <th>Protocol</th>
            <th>Src Bytes</th>
            <th>Dst Bytes</th>
            <th>Count</th>
            <th>Srv Count</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <audio id="alertSound" src="alert.wav" preload="auto"></audio>
    <script>
      const socket = io();
      const tableBody = document.querySelector("#alertsTable tbody");
      const filterBox = document.getElementById("filterBox");
      const alertSound = document.getElementById("alertSound");
      const MAX_ALERTS = 50;
      let alerts = [];
      function addAlert(alert) {
        alerts.unshift(alert);
        renderTable();
        if (alert.pred === "ATTACK") alertSound.play();
      }
      function renderTable() {
        const filter = filterBox.value.toLowerCase();
        tableBody.innerHTML = "";
        let count = 0;
        for (let alert of alerts) {
          if (count >= MAX_ALERTS) break;
          const match =
            !filter ||
            ["src", "dst", "service", "flag"].some((k) =>
              (alert[k] || "").toLowerCase().includes(filter)
            );
          if (match) {
            const tr = document.createElement("tr");
            tr.className =
              alert.pred === "ATTACK" ? "attack highlight" : "normal";
            tr.innerHTML = `<td>${alert.ts || "-"}</td><td>${
              alert.src || "-"
            }</td><td>${alert.dst || "-"}</td>
            <td>${alert.service || "-"}</td><td>${alert.flag || "-"}</td><td>${
              alert.protocol_type || "-"
            }</td>
            <td>${alert.src_bytes || 0}</td><td>${alert.dst_bytes || 0}</td>
            <td>${alert.count || 0}</td><td>${alert.srv_count || 0}</td>
            <td>${alert.pred || "-"}</td>`;
            tableBody.appendChild(tr);
            count++;
          }
        }
      }
      filterBox.addEventListener("input", renderTable);
      socket.on("alert", addAlert);
      fetch("/alerts/download")
        .then((res) => res.json())
        .then((data) => data.reverse().forEach(addAlert));
    </script>
  </body>
</html>
