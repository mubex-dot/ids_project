<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IDS Live Dashboard</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        margin: 0;
        padding: 16px;
        background: #f7f9fc;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      #controls {
        margin-left: auto;
      }
      #alerts {
        margin-top: 12px;
      }
      .alert {
        background: white;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }
      .attack {
        border-left: 6px solid #d9534f;
      }
      .benign {
        border-left: 6px solid #5cb85c;
      }
      pre {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono",
          monospace;
        font-size: 12px;
      }
      #status {
        margin-left: 12px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <header>
      <div style="display: flex; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 20px">IDS Live Dashboard</h1>
        <div id="status" style="margin-left: 12px; color: #666">
          Disconnected
        </div>
      </div>
      <div
        id="controls"
        style="
          margin-top: 10px;
          display: flex;
          gap: 12px;
          align-items: center;
          flex-wrap: wrap;
        "
      >
        <label style="display: flex; align-items: center; gap: 8px"
          ><input id="enableSound" type="checkbox" /> Play sound on
          attack</label
        >
        <label style="display: flex; align-items: center; gap: 8px"
          ><input id="enableToast" type="checkbox" /> Desktop
          notification</label
        >
        <label style="display: flex; align-items: center; gap: 8px"
          ><input id="showOnlyAttacks" type="checkbox" /> Show only
          attacks</label
        >
        <button
          id="clearList"
          style="
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            background: #fff;
          "
        >
          Clear list
        </button>
        <button
          id="downloadLogs"
          style="
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #286ef0;
            background: #286ef0;
            color: white;
          "
        >
          Download logs
        </button>
      </div>
    </header>

    <section
      style="
        margin-top: 18px;
        display: flex;
        gap: 18px;
        align-items: flex-start;
      "
    >
      <div style="flex: 1">
        <div id="summary" style="display: flex; gap: 12px; margin-bottom: 12px">
          <div
            style="
              background: #fff;
              padding: 10px;
              border-radius: 8px;
              box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
              min-width: 120px;
            "
          >
            <div style="font-size: 12px; color: #666">Total</div>
            <div id="totalCount" style="font-weight: 600; font-size: 18px">
              0
            </div>
          </div>
          <div
            style="
              background: #fff;
              padding: 10px;
              border-radius: 8px;
              box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
              min-width: 120px;
            "
          >
            <div style="font-size: 12px; color: #666">Attacks</div>
            <div
              id="attackCount"
              style="font-weight: 600; font-size: 18px; color: #d9534f"
            >
              0
            </div>
          </div>
          <div
            style="
              background: #fff;
              padding: 10px;
              border-radius: 8px;
              box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
              min-width: 120px;
            "
          >
            <div style="font-size: 12px; color: #666">Benign</div>
            <div
              id="benignCount"
              style="font-weight: 600; font-size: 18px; color: #5cb85c"
            >
              0
            </div>
          </div>
        </div>
        <div id="alerts" style="max-height: 60vh; overflow: auto"></div>
      </div>
      <div style="width: 270px">
        <div
          style="
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
          "
        >
          <h3 style="margin: 0 0 8px 0; font-size: 14px">Live Controls</h3>
          <div style="font-size: 13px; color: #444">
            SSE connection: <span id="connState">—</span>
          </div>
          <div style="margin-top: 10px; font-size: 13px; color: #666">
            Hints:
          </div>
          <ul style="margin: 6px 0 0 18px; color: #666; font-size: 13px">
            <li>Toggle sound/notifications</li>
            <li>Download logs for archival</li>
            <li>Use the API `/predict` to feed alerts</li>
          </ul>
        </div>
      </div>
    </section>

    <audio id="alertAudio" preload="auto">
      <source src="/static/alert.wav" type="audio/wav" />
    </audio>

    <script>
      const statusEl = document.getElementById("status");
      const connState = document.getElementById("connState");
      const alertsEl = document.getElementById("alerts");
      const audio = document.getElementById("alertAudio");
      const enableSound = document.getElementById("enableSound");
      const enableToast = document.getElementById("enableToast");
      const showOnlyAttacks = document.getElementById("showOnlyAttacks");
      const clearList = document.getElementById("clearList");
      const downloadLogs = document.getElementById("downloadLogs");

      const totalCount = document.getElementById("totalCount");
      const attackCount = document.getElementById("attackCount");
      const benignCount = document.getElementById("benignCount");

      let items = [];

      function renderSummary() {
        totalCount.textContent = items.length;
        const attacks = items.filter((i) => isAttack(i)).length;
        attackCount.textContent = attacks;
        benignCount.textContent = items.length - attacks;
      }

      function isAttack(payload) {
        return (
          payload?.prediction?.prediction == 1 ||
          payload?.prediction?.prediction === "1" ||
          (payload.prediction && payload.prediction.prediction == 1)
        );
      }

      function renderList() {
        alertsEl.innerHTML = "";
        const shown = showOnlyAttacks.checked ? items.filter(isAttack) : items;
        if (shown.length === 0) {
          alertsEl.innerHTML =
            '<div style="padding:20px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.04);color:#666">No alerts yet — waiting for events from the IDS</div>';
          return;
        }
        for (const payload of shown.slice().reverse()) {
          const attack = isAttack(payload);
          const div = document.createElement("div");
          div.className = "alert " + (attack ? "attack" : "benign");
          div.style.background = "#fff";
          div.style.borderRadius = "6px";
          div.style.padding = "10px";
          div.style.marginBottom = "8px";
          div.style.boxShadow = "0 1px 2px rgba(0,0,0,0.04)";
          div.style.borderLeft = attack
            ? "6px solid #d9534f"
            : "6px solid #5cb85c";
          const header = document.createElement("div");
          header.innerHTML = `<strong>${
            attack ? "Attack" : "Benign"
          }</strong> — ${new Date().toLocaleTimeString()}`;
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(payload, null, 2);
          pre.style.marginTop = "8px";
          pre.style.whiteSpace = "pre-wrap";
          div.appendChild(header);
          div.appendChild(pre);
          alertsEl.appendChild(div);
        }
      }

      function addAlert(payload) {
        items.push(payload);
        // cap in-memory list to 1000
        if (items.length > 1000) items = items.slice(items.length - 1000);
        renderSummary();
        renderList();
        if (isAttack(payload)) {
          if (enableSound.checked) {
            try {
              audio.currentTime = 0;
              audio.play().catch(() => {});
            } catch (e) {}
          }
          if (enableToast.checked) {
            if (Notification.permission === "granted")
              new Notification("IDS Alert", { body: "Attack detected" });
            else if (Notification.permission !== "denied")
              Notification.requestPermission().then((p) => {
                if (p === "granted")
                  new Notification("IDS Alert", { body: "Attack detected" });
              });
          }
        }
      }

      function connect() {
        statusEl.textContent = "Connecting...";
        connState.textContent = "Connecting";
        const es = new EventSource("/alerts/stream");
        es.onopen = () => {
          statusEl.textContent = "Connected";
          connState.textContent = "Open";
        };
        es.onerror = (e) => {
          statusEl.textContent = "Disconnected";
          connState.textContent = "Disconnected";
          es.close();
          setTimeout(connect, 2000);
        };
        es.onmessage = (ev) => {
          try {
            const data = JSON.parse(ev.data);
            addAlert(data);
          } catch (e) {
            console.error("bad event", e);
          }
        };
      }

      clearList.addEventListener("click", () => {
        items = [];
        renderSummary();
        renderList();
      });

      downloadLogs.addEventListener("click", async () => {
        try {
          downloadLogs.disabled = true;
          const res = await fetch("/alerts/download");
          if (!res.ok) throw new Error("Download failed");
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `alerts-${new Date()
            .toISOString()
            .replace(/[:.]/g, "-")}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (e) {
          alert("Failed to download logs");
        } finally {
          downloadLogs.disabled = false;
        }
      });

      // Ask for permission for notifications early
      if ("Notification" in window) {
        if (Notification.permission === "default")
          Notification.requestPermission();
      }

      // Start
      renderSummary();
      renderList();
      connect();
    </script>
  </body>
</html>
